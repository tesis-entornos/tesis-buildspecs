version: 0.2

# Destrucción del entorno efímero de una rama de versión (release/c<N>-<n> o hotfix/c<N>-<n>).
# Corre en los mismos proyectos que el despliegue (tesis-efimero-desplegar-backend y -frontend) con
#   aws codebuild start-build --project-name tesis-efimero-desplegar-<servicio> --source-version main
#     --buildspec-override arn:aws:s3:::tesis-entornos-buildspecs-582621604637/<prefijo>/destruir-efimero.yml
#     --environment-variables-override name=RAMA,value=<rama>,type=PLAINTEXT
# La rama a destruir llega por RAMA (no por la fuente: la rama puede no existir más); la fuente principal
# es main del -cd del proyecto. Solo disparo manual: si el build viene de un webhook, aborta.
# Al correr en los mismos proyectos, la serialización por entorno la cubre: deja su marca de turno y
# espera a los builds anteriores del mismo entorno (scripts/esperar-turno.sh); los posteriores la esperan.
#
# install: Terraform TERRAFORM_VERSION (TERRAFORM_PLATAFORMA) con verificación del SHA256 contra el
# SHA256SUMS oficial, igual que desplegar-efimero.yml (el finally de install imprime la línea JSON).
# pre_build (ABORT; su finally imprime la línea JSON si falla): RAMA tiene que cumplir
# ^(release|hotfix)/c[0-9]+-[0-9]+$; slug = rama en minúsculas con / -> - (20 caracteres o menos);
# corrida = c<N>; N = el n de la rama, entre 1 y 99. Imagen de producción del backend (solo para la
# variable backend_image de entorno/): tag.json de origin/main de la fuente principal en el proyecto
# backend, o de la fuente secundaria backend_cd_main en el frontend. Se registran los commits de
# origin/main propio, de la fuente del otro servicio y de la fuente terraform. Al final, la marca de turno
# s3://MARCAS_BUCKET/entornos/<slug>/turnos/<build-id>.json {build_id, rama, slug, start_time, accion}.
# build: esperar-turno.sh y destruir-entorno.sh (con borrar-datos.py), del bucket bajo SCRIPTS_PREFIX.
# destruir-entorno.sh: servicio a 0, borrado de datos con una tarea one-off (exit 0 obligatorio),
# terraform destroy y limpieza fuera de Terraform (marcador, marcas, revisiones de la task definition;
# el terraform.tfstate se conserva). Una falla deja el build FAILED con "destruccion - <etapa> - <motivo>".
# post_build: la línea JSON (contexto, ETags de los scripts, commits de las fuentes, resultado del
# script) se sube como destruccion.json a
# s3://REGISTROS_BUCKET/destrucciones/corrida=<corrida>/<UUID del build>/ (prefijo aparte de
# validaciones/). Si la subida falla, el build queda FAILED. resultado: ok, "nada que destruir" o el motivo.
# SERVICIO, GITHUB_CD_REPO y FIRST_SUPERUSER_PASSWORD los pone el proyecto (el último no se usa acá).

env:
  shell: bash
  variables:
    RAMA: ""
    TAG_FILE: tag.json
    MODELO: efimero
    SCRIPTS_BUCKET: tesis-entornos-buildspecs-582621604637
    SCRIPTS_PREFIX: main
    TRABAJO_DIR: /tmp/efimero
    MARCAS_BUCKET: tesis-entornos-tfstate-398846004421
    STATES_BUCKET: tesis-entornos-tfstate-398846004421
    PROYECTOS: tesis-efimero-desplegar-backend tesis-efimero-desplegar-frontend
    INTERVALO_SEG: "15"
    ESPERA_MAX_SEG: "3600"
    TERRAFORM_VERSION: 1.17.1
    TERRAFORM_PLATAFORMA: linux_arm64
    TERRAFORM_BIN_DIR: /usr/local/bin
    TERRAFORM_SUBDIR: entorno
    REGISTROS_BUCKET: tesis-efimero-registros-398846004421

phases:
  install:
    on-failure: ABORT
    commands:
      - export BUILD_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; export MOTIVO=""; export INSTALL_OK=""; export VALIDACION_OK=""; export SLUG=""; export CORRIDA=""; export N=""; export MARCA_URI=""; export MARCA_ESCRITA=""; export SERIALIZACION="sin_correr"; export SERIALIZACION_ETAG=""; export SERIALIZACION_RESULTADO="$TRABAJO_DIR/serializacion.json"; export TERRAFORM_VERSION_INSTALADA=""; export TERRAFORM_DIR=""; export BACKEND_IMAGEN_PROD=""; export COMMIT_CD_MAIN_PROPIO=""; export COMMIT_CD_MAIN_OTRO=""; export COMMIT_TERRAFORM=""; export DESTRUCCION="sin_correr"; export DESTRUIR_ENTORNO_ETAG=""; export BORRAR_DATOS_ETAG=""; export DESTRUIR_RESULTADO="$TRABAJO_DIR/destruir-entorno.json"; export REGISTRO_URI=""; mkdir -p "$TRABAJO_DIR"; rm -f "$SERIALIZACION_RESULTADO" "$DESTRUIR_RESULTADO"
      - '[[ "${TERRAFORM_VERSION:-}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && [[ "${TERRAFORM_PLATAFORMA:-}" =~ ^[a-z0-9]+_[a-z0-9]+$ ]] && [ -n "${TERRAFORM_BIN_DIR:-}" ] || { export MOTIVO="TERRAFORM_VERSION, TERRAFORM_PLATAFORMA o TERRAFORM_BIN_DIR invalidos (${TERRAFORM_VERSION:-<vacia>}, ${TERRAFORM_PLATAFORMA:-<vacia>}, ${TERRAFORM_BIN_DIR:-<vacia>})"; echo "ERROR - $MOTIVO"; false; }'
      - export TF_DESCARGA="$TRABAJO_DIR/terraform-descarga"; export TF_ZIP="terraform_${TERRAFORM_VERSION}_${TERRAFORM_PLATAFORMA}.zip"; export TF_SUMS="terraform_${TERRAFORM_VERSION}_SHA256SUMS"; export TF_URL="https://releases.hashicorp.com/terraform/$TERRAFORM_VERSION"; mkdir -p "$TF_DESCARGA" && curl -fsSL --retry 3 -o "$TF_DESCARGA/$TF_ZIP" "$TF_URL/$TF_ZIP" && curl -fsSL --retry 3 -o "$TF_DESCARGA/$TF_SUMS" "$TF_URL/$TF_SUMS" && echo "Bajados $TF_URL/$TF_ZIP y $TF_URL/$TF_SUMS" || { export MOTIVO="no se pudo bajar Terraform de $TF_URL ($TF_ZIP o $TF_SUMS)"; echo "ERROR - $MOTIVO"; false; }
      - export TF_SHA_ESPERADO="$(awk -v f="$TF_ZIP" '$2 == f {print $1}' "$TF_DESCARGA/$TF_SUMS")"; export TF_SHA_OBTENIDO="$(sha256sum "$TF_DESCARGA/$TF_ZIP" | cut -d ' ' -f 1)"; echo "SHA256 de $TF_ZIP - SHA256SUMS ${TF_SHA_ESPERADO:-<sin entrada>}, zip $TF_SHA_OBTENIDO"; [[ "$TF_SHA_ESPERADO" =~ ^[0-9a-f]{64}$ ]] && [ "$TF_SHA_OBTENIDO" = "$TF_SHA_ESPERADO" ] || { export MOTIVO="el SHA256 de $TF_ZIP ($TF_SHA_OBTENIDO) no coincide con el de $TF_SUMS (${TF_SHA_ESPERADO:-sin entrada para el zip})"; echo "ERROR - $MOTIVO"; false; }
      - mkdir -p "$TERRAFORM_BIN_DIR" && unzip -o -q "$TF_DESCARGA/$TF_ZIP" terraform -d "$TERRAFORM_BIN_DIR" && export TERRAFORM_VERSION_INSTALADA="$(terraform version -json | jq -r .terraform_version)" && [ "$TERRAFORM_VERSION_INSTALADA" = "$TERRAFORM_VERSION" ] && [ "$(command -v terraform)" = "$TERRAFORM_BIN_DIR/terraform" ] && echo "Terraform $TERRAFORM_VERSION_INSTALADA en $(command -v terraform)" || { export MOTIVO="no se pudo instalar Terraform $TERRAFORM_VERSION en $TERRAFORM_BIN_DIR (en el PATH esta $(command -v terraform || echo nada), version ${TERRAFORM_VERSION_INSTALADA:-sin leer})"; echo "ERROR - $MOTIVO"; false; }
      - export INSTALL_OK=1
    finally:
      - if [ "${INSTALL_OK:-}" != "1" ]; then export RESULTADO="${MOTIVO:-fallo inesperado en install}"; jq -nc --arg modelo "${MODELO:-}" --arg servicio "${SERVICIO:-}" --arg build_id "${CODEBUILD_BUILD_ID:-}" --arg build_started_at "${BUILD_STARTED_AT:-}" --arg rama "${RAMA:-}" --arg slug "${SLUG:-}" --arg corrida "${CORRIDA:-}" --arg n "${N:-}" --arg source_version "${CODEBUILD_SOURCE_VERSION:-}" --arg commit "${CODEBUILD_RESOLVED_SOURCE_VERSION:-}" --arg webhook_trigger "${CODEBUILD_WEBHOOK_TRIGGER:-}" --arg serializacion_etag "${SERIALIZACION_ETAG:-}" --arg imagen_backend_prod "${BACKEND_IMAGEN_PROD:-}" --arg commit_cd_main_propio "${COMMIT_CD_MAIN_PROPIO:-}" --arg commit_cd_main_otro "${COMMIT_CD_MAIN_OTRO:-}" --arg commit_terraform "${COMMIT_TERRAFORM:-}" --arg terraform_version "${TERRAFORM_VERSION_INSTALADA:-}" --arg cd_repo "${GITHUB_CD_REPO:-}" --arg scripts_prefijo "${SCRIPTS_PREFIX:-}" --arg destruir_entorno_etag "${DESTRUIR_ENTORNO_ETAG:-}" --arg borrar_datos_etag "${BORRAR_DATOS_ETAG:-}" --arg destruccion_resultado "${DESTRUCCION:-sin_correr}" --arg build_ok "${CODEBUILD_BUILD_SUCCEEDING:-0}" --arg registro_uri "${REGISTRO_URI:-}" --arg marca "$([ "${MARCA_ESCRITA:-}" = "1" ] && echo "${MARCA_URI:-}")" --argjson serializacion "$([ -s "${SERIALIZACION_RESULTADO:-/nonexistent}" ] && jq -c . "$SERIALIZACION_RESULTADO" 2> /dev/null || echo null)" --argjson destruccion "$([ -s "${DESTRUIR_RESULTADO:-/nonexistent}" ] && jq -c . "$DESTRUIR_RESULTADO" 2> /dev/null || echo null)" --arg resultado "$RESULTADO" 'def n:if . == "" then null else . end; {modelo:($modelo|n),servicio:($servicio|n),build_id:($build_id|n),build_started_at:($build_started_at|n),rama:($rama|n),slug:($slug|n),corrida:($corrida|n),n:($n|tonumber? // null),source_version:($source_version|n),commit:($commit|n),webhook_trigger:($webhook_trigger|n),marca_turno:($marca|n),serializacion_script_etag:($serializacion_etag|n),serializacion:$serializacion,imagen_backend_prod:($imagen_backend_prod|n),commits:{cd_main_propio:($commit_cd_main_propio|n),cd_main_otro:($commit_cd_main_otro|n),terraform:($commit_terraform|n)},terraform_version:($terraform_version|n),cd_repo:($cd_repo|n),scripts:{prefijo:($scripts_prefijo|n),esperar_turno_etag:($serializacion_etag|n),destruir_entorno_etag:($destruir_entorno_etag|n),borrar_datos_etag:($borrar_datos_etag|n)},destruccion_resultado:$destruccion_resultado,destruccion:$destruccion,build_ok:($build_ok == "1"),registro_uri:($registro_uri|n),resultado:$resultado}'; fi
  pre_build:
    on-failure: ABORT
    commands:
      - MISSING=""; for v in MODELO SERVICIO RAMA TAG_FILE SCRIPTS_BUCKET SCRIPTS_PREFIX TRABAJO_DIR MARCAS_BUCKET STATES_BUCKET PROYECTOS INTERVALO_SEG ESPERA_MAX_SEG TERRAFORM_SUBDIR REGISTROS_BUCKET CODEBUILD_BUILD_ID; do [ -n "${!v:-}" ] || MISSING="$MISSING $v"; done; [ -z "$MISSING" ] || { export MOTIVO="faltan variables$MISSING"; echo "ERROR - $MOTIVO"; false; }
      - '[ "$MODELO" = "efimero" ] || { export MOTIVO="MODELO tiene que ser efimero ($MODELO)"; echo "ERROR - $MOTIVO"; false; }'
      - '[[ "$SERVICIO" =~ ^(backend|frontend)$ ]] || { export MOTIVO="SERVICIO tiene que ser backend o frontend ($SERVICIO)"; echo "ERROR - $MOTIVO"; false; }'
      - '[[ "$MARCAS_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || { export MOTIVO="MARCAS_BUCKET invalido ($MARCAS_BUCKET)"; echo "ERROR - $MOTIVO"; false; }'
      - '[[ "$STATES_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || { export MOTIVO="STATES_BUCKET invalido ($STATES_BUCKET)"; echo "ERROR - $MOTIVO"; false; }'
      - '[[ "$REGISTROS_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || { export MOTIVO="REGISTROS_BUCKET invalido ($REGISTROS_BUCKET)"; echo "ERROR - $MOTIVO"; false; }'
      - '[ -z "${CODEBUILD_WEBHOOK_TRIGGER:-}" ] && [ -z "${CODEBUILD_WEBHOOK_HEAD_REF:-}" ] || { export MOTIVO="la destruccion solo se dispara a mano (start-build), no por webhook (${CODEBUILD_WEBHOOK_TRIGGER:-}${CODEBUILD_WEBHOOK_HEAD_REF:-})"; echo "ERROR - $MOTIVO"; false; }'
      - export RAMA="${RAMA#refs/heads/}"; echo "Rama a destruir ${RAMA:-<vacia>} (variable RAMA), fuente principal ${CODEBUILD_SOURCE_VERSION:-<vacia>}"
      - '[[ "$RAMA" =~ ^(release|hotfix)/c([0-9]+)-([0-9]+)$ ]] && export CORRIDA="c${BASH_REMATCH[2]}" && export N="$((10#${BASH_REMATCH[3]}))" || { export MOTIVO="la rama ${RAMA:-<vacia>} no es de version, tiene que cumplir ^(release|hotfix)/c[0-9]+-[0-9]+$"; echo "ERROR - $MOTIVO"; false; }'
      - '[ "$N" -ge 1 ] && [ "$N" -le 99 ] || { export MOTIVO="N=$N (la version de la rama $RAMA) tiene que estar entre 1 y 99 (prioridad del listener N*10)"; echo "ERROR - $MOTIVO"; false; }'
      - export SLUG="$(printf '%s' "$RAMA" | tr '[:upper:]' '[:lower:]' | tr / -)"; echo "Slug $SLUG (${#SLUG} caracteres), corrida $CORRIDA, N $N"
      - '[ "${#SLUG}" -le 20 ] || { export MOTIVO="el slug $SLUG tiene ${#SLUG} caracteres, el maximo es 20"; echo "ERROR - $MOTIVO"; false; }'
      - export REGISTRO_URI="s3://$REGISTROS_BUCKET/destrucciones/corrida=$CORRIDA/${CODEBUILD_BUILD_ID##*:}/"; echo "Registro $REGISTRO_URI"
      - if [ "$SERVICIO" = "backend" ]; then export OTRO_SERVICIO="frontend"; else export OTRO_SERVICIO="backend"; fi; export OTRO_FUENTE="${OTRO_SERVICIO}_cd_main"; export OTRO_FUENTE_VAR="CODEBUILD_SRC_DIR_$OTRO_FUENTE"; export OTRO_DIR="${!OTRO_FUENTE_VAR:-}"; export TERRAFORM_DIR="${CODEBUILD_SRC_DIR_terraform:-}/$TERRAFORM_SUBDIR"; echo "Fuente $OTRO_FUENTE en ${OTRO_DIR:-<vacia>}, fuente terraform en ${CODEBUILD_SRC_DIR_terraform:-<vacia>}"
      - '[ -n "$OTRO_DIR" ] && [ -d "$OTRO_DIR" ] || { export MOTIVO="falta la fuente secundaria $OTRO_FUENTE ($OTRO_FUENTE_VAR=${OTRO_DIR:-<vacia>})"; echo "ERROR - $MOTIVO"; false; }'
      - '[ -n "${CODEBUILD_SRC_DIR_terraform:-}" ] && [ -d "$TERRAFORM_DIR" ] || { export MOTIVO="falta la fuente secundaria terraform o su directorio $TERRAFORM_SUBDIR (CODEBUILD_SRC_DIR_terraform=${CODEBUILD_SRC_DIR_terraform:-<vacia>})"; echo "ERROR - $MOTIVO"; false; }'
      - export COMMIT_CD_MAIN_PROPIO="$(git rev-parse --verify -q "origin/main^{commit}" 2> /dev/null)"; export COMMIT_CD_MAIN_OTRO="$(git -C "$OTRO_DIR" rev-parse --verify -q "HEAD^{commit}" 2> /dev/null)"; export COMMIT_TERRAFORM="$(git -C "$CODEBUILD_SRC_DIR_terraform" rev-parse --verify -q "HEAD^{commit}" 2> /dev/null)"; echo "Commits - origin/main propio ${COMMIT_CD_MAIN_PROPIO:-<sin resolver>}, $OTRO_FUENTE ${COMMIT_CD_MAIN_OTRO:-<sin resolver>}, terraform ${COMMIT_TERRAFORM:-<sin resolver>}"
      - '[[ "$COMMIT_CD_MAIN_PROPIO" =~ ^[0-9a-f]{40}$ ]] || { export MOTIVO="no se pudo resolver origin/main en la fuente principal (hace falta el clon completo)"; echo "ERROR - $MOTIVO"; false; }'
      - '[[ "$COMMIT_CD_MAIN_OTRO" =~ ^[0-9a-f]{40}$ ]] || { export MOTIVO="no se pudo resolver el commit de la fuente $OTRO_FUENTE"; echo "ERROR - $MOTIVO"; false; }'
      - '[[ "$COMMIT_TERRAFORM" =~ ^[0-9a-f]{40}$ ]] || { export MOTIVO="no se pudo resolver el commit de la fuente terraform"; echo "ERROR - $MOTIVO"; false; }'
      - export TAG_BACKEND="$TRABAJO_DIR/tag-main-backend.json"; if [ "$SERVICIO" = "backend" ]; then export TAG_BACKEND_ORIGEN="origin/main:$TAG_FILE de la fuente principal"; git show "origin/main:$TAG_FILE" > "$TAG_BACKEND" 2> /dev/null; else export TAG_BACKEND_ORIGEN="$TAG_FILE de la fuente $OTRO_FUENTE"; cp "$OTRO_DIR/$TAG_FILE" "$TAG_BACKEND" 2> /dev/null; fi; [ -s "$TAG_BACKEND" ] || { export MOTIVO="no se pudo leer el $TAG_BACKEND_ORIGEN"; echo "ERROR - $MOTIVO"; false; }
      - jq -e 'all(.repo, .digest; type == "string" and length > 0) and (.digest | test("^sha256:[0-9a-f]{64}$"))' "$TAG_BACKEND" > /dev/null 2>&1 || { export MOTIVO="el $TAG_BACKEND_ORIGEN no tiene repo y digest sha256 validos"; echo "ERROR - $MOTIVO"; cat "$TAG_BACKEND"; false; }
      - export BACKEND_IMAGEN_PROD="$(jq -r '"\(.repo)@\(.digest)"' "$TAG_BACKEND")"; echo "Imagen de produccion del backend $BACKEND_IMAGEN_PROD (commit $(jq -r '.commit // "?"' "$TAG_BACKEND"), de $TAG_BACKEND_ORIGEN); solo para la variable backend_image del destroy"
      - export MARCA_URI="s3://$MARCAS_BUCKET/entornos/$SLUG/turnos/$CODEBUILD_BUILD_ID.json"; export START_TIME="$(aws codebuild batch-get-builds --ids "$CODEBUILD_BUILD_ID" --query 'builds[0].startTime' --output text 2> /dev/null)"; [ -n "$START_TIME" ] && [ "$START_TIME" != "None" ] && jq -nc --arg build_id "$CODEBUILD_BUILD_ID" --arg rama "$RAMA" --arg slug "$SLUG" --arg start_time "$START_TIME" '{build_id:$build_id,rama:$rama,slug:$slug,start_time:$start_time,accion:"destruir"}' | aws s3 cp - "$MARCA_URI" --content-type application/json --only-show-errors && export MARCA_ESCRITA=1 && echo "Marca de turno $MARCA_URI (start_time $START_TIME)" || { export MOTIVO="no se pudo escribir la marca de turno $MARCA_URI (start_time ${START_TIME:-<sin leer>})"; echo "ERROR - $MOTIVO"; false; }
      - export VALIDACION_OK=1; echo "Validacion ok - destruccion de la rama $RAMA, slug $SLUG, corrida $CORRIDA, N $N, servicio del proyecto $SERVICIO, terraform $TERRAFORM_VERSION_INSTALADA"
    finally:
      - if [ "${VALIDACION_OK:-}" != "1" ]; then export RESULTADO="${MOTIVO:-fallo inesperado en pre_build}"; jq -nc --arg modelo "${MODELO:-}" --arg servicio "${SERVICIO:-}" --arg build_id "${CODEBUILD_BUILD_ID:-}" --arg build_started_at "${BUILD_STARTED_AT:-}" --arg rama "${RAMA:-}" --arg slug "${SLUG:-}" --arg corrida "${CORRIDA:-}" --arg n "${N:-}" --arg source_version "${CODEBUILD_SOURCE_VERSION:-}" --arg commit "${CODEBUILD_RESOLVED_SOURCE_VERSION:-}" --arg webhook_trigger "${CODEBUILD_WEBHOOK_TRIGGER:-}" --arg serializacion_etag "${SERIALIZACION_ETAG:-}" --arg imagen_backend_prod "${BACKEND_IMAGEN_PROD:-}" --arg commit_cd_main_propio "${COMMIT_CD_MAIN_PROPIO:-}" --arg commit_cd_main_otro "${COMMIT_CD_MAIN_OTRO:-}" --arg commit_terraform "${COMMIT_TERRAFORM:-}" --arg terraform_version "${TERRAFORM_VERSION_INSTALADA:-}" --arg cd_repo "${GITHUB_CD_REPO:-}" --arg scripts_prefijo "${SCRIPTS_PREFIX:-}" --arg destruir_entorno_etag "${DESTRUIR_ENTORNO_ETAG:-}" --arg borrar_datos_etag "${BORRAR_DATOS_ETAG:-}" --arg destruccion_resultado "${DESTRUCCION:-sin_correr}" --arg build_ok "${CODEBUILD_BUILD_SUCCEEDING:-0}" --arg registro_uri "${REGISTRO_URI:-}" --arg marca "$([ "${MARCA_ESCRITA:-}" = "1" ] && echo "${MARCA_URI:-}")" --argjson serializacion "$([ -s "${SERIALIZACION_RESULTADO:-/nonexistent}" ] && jq -c . "$SERIALIZACION_RESULTADO" 2> /dev/null || echo null)" --argjson destruccion "$([ -s "${DESTRUIR_RESULTADO:-/nonexistent}" ] && jq -c . "$DESTRUIR_RESULTADO" 2> /dev/null || echo null)" --arg resultado "$RESULTADO" 'def n:if . == "" then null else . end; {modelo:($modelo|n),servicio:($servicio|n),build_id:($build_id|n),build_started_at:($build_started_at|n),rama:($rama|n),slug:($slug|n),corrida:($corrida|n),n:($n|tonumber? // null),source_version:($source_version|n),commit:($commit|n),webhook_trigger:($webhook_trigger|n),marca_turno:($marca|n),serializacion_script_etag:($serializacion_etag|n),serializacion:$serializacion,imagen_backend_prod:($imagen_backend_prod|n),commits:{cd_main_propio:($commit_cd_main_propio|n),cd_main_otro:($commit_cd_main_otro|n),terraform:($commit_terraform|n)},terraform_version:($terraform_version|n),cd_repo:($cd_repo|n),scripts:{prefijo:($scripts_prefijo|n),esperar_turno_etag:($serializacion_etag|n),destruir_entorno_etag:($destruir_entorno_etag|n),borrar_datos_etag:($borrar_datos_etag|n)},destruccion_resultado:$destruccion_resultado,destruccion:$destruccion,build_ok:($build_ok == "1"),registro_uri:($registro_uri|n),resultado:$resultado}'; fi
  build:
    commands:
      - for v in CODEBUILD_SOURCE_VERSION CODEBUILD_RESOLVED_SOURCE_VERSION CODEBUILD_BUILD_ID RAMA SCRIPTS_PREFIX; do echo "$v=${!v:-<vacia>}"; done
      - export SERIALIZACION="pendiente"; export SERIALIZACION_ETAG="$(aws s3api get-object --bucket "$SCRIPTS_BUCKET" --key "$SCRIPTS_PREFIX/scripts/esperar-turno.sh" "$TRABAJO_DIR/esperar-turno.sh" --query ETag --output text | tr -d '"')" && [ -n "$SERIALIZACION_ETAG" ] && echo "Script s3://$SCRIPTS_BUCKET/$SCRIPTS_PREFIX/scripts/esperar-turno.sh (ETag $SERIALIZACION_ETAG)" || { export SERIALIZACION="fallo"; export MOTIVO="no se pudo bajar s3://$SCRIPTS_BUCKET/$SCRIPTS_PREFIX/scripts/esperar-turno.sh"; echo "ERROR - $MOTIVO"; false; }
      - SALIDA_JSON="$SERIALIZACION_RESULTADO" bash "$TRABAJO_DIR/esperar-turno.sh" && export SERIALIZACION="ok" || { export SERIALIZACION="fallo"; export MOTIVO="serializacion - $(jq -r '.motivo // "sin motivo"' "$SERIALIZACION_RESULTADO" 2> /dev/null || echo "sin resultado del script")"; echo "ERROR - $MOTIVO"; false; }
      - export DESTRUCCION="pendiente"; export DESTRUIR_ENTORNO_ETAG="$(aws s3api get-object --bucket "$SCRIPTS_BUCKET" --key "$SCRIPTS_PREFIX/scripts/destruir-entorno.sh" "$TRABAJO_DIR/destruir-entorno.sh" --query ETag --output text | tr -d '"')"; export BORRAR_DATOS_ETAG="$(aws s3api get-object --bucket "$SCRIPTS_BUCKET" --key "$SCRIPTS_PREFIX/scripts/borrar-datos.py" "$TRABAJO_DIR/borrar-datos.py" --query ETag --output text | tr -d '"')"; [ -n "$DESTRUIR_ENTORNO_ETAG" ] && [ -n "$BORRAR_DATOS_ETAG" ] && echo "Scripts de s3://$SCRIPTS_BUCKET/$SCRIPTS_PREFIX/scripts/ - destruir-entorno.sh $DESTRUIR_ENTORNO_ETAG, borrar-datos.py $BORRAR_DATOS_ETAG" || { export DESTRUCCION="fallo"; export MOTIVO="destruccion - no se pudieron bajar destruir-entorno.sh o borrar-datos.py de s3://$SCRIPTS_BUCKET/$SCRIPTS_PREFIX/scripts/"; echo "ERROR - $MOTIVO"; false; }
      - MODELO="$MODELO" SLUG="$SLUG" N="$N" CORRIDA="$CORRIDA" TERRAFORM_DIR="$TERRAFORM_DIR" BACKEND_IMAGEN_PROD="$BACKEND_IMAGEN_PROD" STATES_BUCKET="$STATES_BUCKET" MARCAS_BUCKET="$MARCAS_BUCKET" SCRIPTS_DIR="$TRABAJO_DIR" SALIDA_JSON="$DESTRUIR_RESULTADO" bash "$TRABAJO_DIR/destruir-entorno.sh" && export DESTRUCCION="$(jq -r '.resultado' "$DESTRUIR_RESULTADO")" || { export DESTRUCCION="fallo"; export MOTIVO="destruccion - $(jq -r '"\(.etapa // "sin etapa") - \(.motivo // "sin motivo")"' "$DESTRUIR_RESULTADO" 2> /dev/null || echo "sin resultado de destruir-entorno.sh")"; echo "ERROR - $MOTIVO"; false; }
  post_build:
    commands:
      - export DESTRUCCION_JSON="$TRABAJO_DIR/destruccion.json"; rm -f "$DESTRUCCION_JSON"; if [ "${VALIDACION_OK:-}" = "1" ] && [ "${CODEBUILD_BUILD_SUCCEEDING:-0}" = "1" ]; then if [ "$DESTRUCCION" = "nada que destruir" ]; then export RESULTADO="nada que destruir"; else export RESULTADO="ok"; fi; else export RESULTADO="${MOTIVO:-fallo en build}"; fi; jq -nc --arg modelo "${MODELO:-}" --arg servicio "${SERVICIO:-}" --arg build_id "${CODEBUILD_BUILD_ID:-}" --arg build_started_at "${BUILD_STARTED_AT:-}" --arg rama "${RAMA:-}" --arg slug "${SLUG:-}" --arg corrida "${CORRIDA:-}" --arg n "${N:-}" --arg source_version "${CODEBUILD_SOURCE_VERSION:-}" --arg commit "${CODEBUILD_RESOLVED_SOURCE_VERSION:-}" --arg webhook_trigger "${CODEBUILD_WEBHOOK_TRIGGER:-}" --arg serializacion_etag "${SERIALIZACION_ETAG:-}" --arg imagen_backend_prod "${BACKEND_IMAGEN_PROD:-}" --arg commit_cd_main_propio "${COMMIT_CD_MAIN_PROPIO:-}" --arg commit_cd_main_otro "${COMMIT_CD_MAIN_OTRO:-}" --arg commit_terraform "${COMMIT_TERRAFORM:-}" --arg terraform_version "${TERRAFORM_VERSION_INSTALADA:-}" --arg cd_repo "${GITHUB_CD_REPO:-}" --arg scripts_prefijo "${SCRIPTS_PREFIX:-}" --arg destruir_entorno_etag "${DESTRUIR_ENTORNO_ETAG:-}" --arg borrar_datos_etag "${BORRAR_DATOS_ETAG:-}" --arg destruccion_resultado "${DESTRUCCION:-sin_correr}" --arg build_ok "${CODEBUILD_BUILD_SUCCEEDING:-0}" --arg registro_uri "${REGISTRO_URI:-}" --arg marca "$([ "${MARCA_ESCRITA:-}" = "1" ] && echo "${MARCA_URI:-}")" --argjson serializacion "$([ -s "${SERIALIZACION_RESULTADO:-/nonexistent}" ] && jq -c . "$SERIALIZACION_RESULTADO" 2> /dev/null || echo null)" --argjson destruccion "$([ -s "${DESTRUIR_RESULTADO:-/nonexistent}" ] && jq -c . "$DESTRUIR_RESULTADO" 2> /dev/null || echo null)" --arg resultado "$RESULTADO" 'def n:if . == "" then null else . end; {modelo:($modelo|n),servicio:($servicio|n),build_id:($build_id|n),build_started_at:($build_started_at|n),rama:($rama|n),slug:($slug|n),corrida:($corrida|n),n:($n|tonumber? // null),source_version:($source_version|n),commit:($commit|n),webhook_trigger:($webhook_trigger|n),marca_turno:($marca|n),serializacion_script_etag:($serializacion_etag|n),serializacion:$serializacion,imagen_backend_prod:($imagen_backend_prod|n),commits:{cd_main_propio:($commit_cd_main_propio|n),cd_main_otro:($commit_cd_main_otro|n),terraform:($commit_terraform|n)},terraform_version:($terraform_version|n),cd_repo:($cd_repo|n),scripts:{prefijo:($scripts_prefijo|n),esperar_turno_etag:($serializacion_etag|n),destruir_entorno_etag:($destruir_entorno_etag|n),borrar_datos_etag:($borrar_datos_etag|n)},destruccion_resultado:$destruccion_resultado,destruccion:$destruccion,build_ok:($build_ok == "1"),registro_uri:($registro_uri|n),resultado:$resultado}' > "$DESTRUCCION_JSON" && cat "$DESTRUCCION_JSON"
      - aws s3 cp "$DESTRUCCION_JSON" "${REGISTRO_URI}destruccion.json" --content-type application/json --only-show-errors && echo "Registro ${REGISTRO_URI}destruccion.json" || { echo "ERROR - no se pudo subir destruccion.json a $REGISTRO_URI; registro perdido"; false; }
