  build:
    commands:
      - export SERIALIZACION="pendiente"; mkdir -p "$TRABAJO_DIR" && export SERIALIZACION_ETAG="$(aws s3api get-object --bucket "$SCRIPTS_BUCKET" --key "$SCRIPTS_PREFIX/scripts/esperar-turno.sh" "$TRABAJO_DIR/esperar-turno.sh" --query ETag --output text | tr -d '"')" && [ -n "$SERIALIZACION_ETAG" ] && echo "Script s3://$SCRIPTS_BUCKET/$SCRIPTS_PREFIX/scripts/esperar-turno.sh (ETag $SERIALIZACION_ETAG)" || { export SERIALIZACION="fallo"; export MOTIVO="no se pudo bajar s3://$SCRIPTS_BUCKET/$SCRIPTS_PREFIX/scripts/esperar-turno.sh"; echo "ERROR - $MOTIVO"; false; }
