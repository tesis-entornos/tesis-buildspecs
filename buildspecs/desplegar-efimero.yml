version: 0.2

# Despliegue al entorno efímero de una rama de versión (release/c<N>-<n> o hotfix/c<N>-<n>).
# Fuente principal: el repo -cd en el commit de la rama que disparó el webhook (clon completo).
# Fuentes secundarias: terraform (tesis-terraform; entorno/ en TERRAFORM_SUBDIR) y el main del otro
# repo -cd (frontend_cd_main en el proyecto backend, backend_cd_main en el frontend).
# Hoy: instala Terraform, valida, deja la marca de turno, serializa por entorno y crea el entorno si
# no existe. Pasos siguientes (no implementados): desplegar el servicio del repo, espera, suite y
# registro.
#
# install: Terraform TERRAFORM_VERSION (TERRAFORM_PLATAFORMA) de releases.hashicorp.com en
# TERRAFORM_BIN_DIR. El SHA256 del zip tiene que coincidir con el del SHA256SUMS oficial de la versión;
# si no, aborta (el finally de install imprime la línea JSON).
# Rama: CODEBUILD_WEBHOOK_HEAD_REF sin refs/heads/ o, si el build fue manual, CODEBUILD_SOURCE_VERSION.
# Tiene que cumplir ^(release|hotfix)/c[0-9]+-[0-9]+$. slug = rama en minúsculas con / -> - (20
# caracteres o menos); corrida = c<N>; N = el n de la rama (release/c1-7 -> 7), entre 1 y 99: la
# prioridad de su regla en el listener es N*10. tag.json tiene que traer repo, commit, tag, digest y
# rama, y su rama tiene que ser la del build.
# Imágenes de producción (con las que se crea el entorno): tag.json de main de cada -cd (repo, commit,
# tag, digest; sin rama). El propio sale de git show origin/main:tag.json en la fuente principal; el del
# otro servicio, de su fuente secundaria. Se registran los commits de origin/main propio, de la fuente
# del otro y de la fuente terraform.
# Termina siempre con una línea JSON con el contexto del disparo y resultado (ok o el motivo de falla):
# si falla install, la imprime su finally; si falla la validación, la imprime el finally de pre_build
# (con ABORT no corre post_build); si no, post_build.
# Serialización por entorno: al final de pre_build, apenas pasa la validación, el build deja su marca
# s3://MARCAS_BUCKET/entornos/<slug>/turnos/<build-id>.json {build_id, rama, slug, start_time} (no se
# borra: queda como historia). El primer paso de build es scripts/esperar-turno.sh (del bucket, bajo
# SCRIPTS_PREFIX): espera a los builds anteriores de la misma rama en PROYECTOS. Si la marca no se
# puede escribir, pre_build aborta. El JSON del script va en el bloque serializacion de la línea final.
# Aprovisionamiento: después de la serialización, si existe
# s3://STATES_BUCKET/entornos/<slug>/disponible.json el entorno ya está creado y no se hace nada
# (aprovisionamiento.creado = false). Si no, scripts/crear-entorno.sh (con desplegar-frontend.sh y
# esperar-entorno.sh, del bucket bajo SCRIPTS_PREFIX) lo crea con las imágenes de producción y, solo
# si todo sale bien, escribe ese marcador. Si falla, el build falla con
# "aprovisionamiento - <etapa>: <motivo>" y sin marcador: el próximo build del entorno reintenta (el
# apply completa lo que haya quedado). El JSON del script va en aprovisionamiento.crear_entorno.
# SIMULAR_TRABAJO_SEG: SOLO PARA PRUEBAS. Si es > 0, después del aprovisionamiento el build duerme
# esos segundos, para poder probar la espera con builds superpuestos. En uso normal, 0.
# SERVICIO y GITHUB_CD_REPO no van acá: los pone el proyecto.

env:
  shell: bash
  variables:
    TAG_FILE: tag.json
    MODELO: efimero
    SCRIPTS_BUCKET: tesis-entornos-buildspecs-582621604637
    SCRIPTS_PREFIX: main
    TRABAJO_DIR: /tmp/efimero
    MARCAS_BUCKET: tesis-entornos-tfstate-398846004421
    STATES_BUCKET: tesis-entornos-tfstate-398846004421
    PROYECTOS: tesis-efimero-desplegar-backend tesis-efimero-desplegar-frontend
    INTERVALO_SEG: "15"
    ESPERA_MAX_SEG: "3600"
    SIMULAR_TRABAJO_SEG: "0"
    TERRAFORM_VERSION: 1.17.1
    TERRAFORM_PLATAFORMA: linux_arm64
    TERRAFORM_BIN_DIR: /usr/local/bin
    TERRAFORM_SUBDIR: entorno

phases:
  install:
    on-failure: ABORT
    commands:
      - export BUILD_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; export MOTIVO=""; export INSTALL_OK=""; export VALIDACION_OK=""; export RAMA=""; export RAMA_ORIGEN=""; export SLUG=""; export CORRIDA=""; export N=""; export TAG_REPO=""; export TAG_COMMIT=""; export TAG_TAG=""; export TAG_DIGEST=""; export TAG_RAMA=""; export MARCA_URI=""; export MARCA_ESCRITA=""; export SERIALIZACION="sin_correr"; export SERIALIZACION_ETAG=""; export SERIALIZACION_RESULTADO="$TRABAJO_DIR/serializacion.json"; export TERRAFORM_VERSION_INSTALADA=""; export TERRAFORM_DIR=""; export BACKEND_IMAGEN_PROD=""; export FRONTEND_IMAGEN_PROD=""; export COMMIT_CD_MAIN_PROPIO=""; export COMMIT_CD_MAIN_OTRO=""; export COMMIT_TERRAFORM=""; export APROVISIONAMIENTO="sin_correr"; export APROV_CREADO=""; export MARCADOR_PREVIO=""; export CREAR_ENTORNO_ETAG=""; export DESPLEGAR_FRONTEND_ETAG=""; export ESPERAR_ENTORNO_ETAG=""; export CREAR_ENTORNO_RESULTADO="$TRABAJO_DIR/crear-entorno.json"; mkdir -p "$TRABAJO_DIR"; rm -f "$SERIALIZACION_RESULTADO" "$CREAR_ENTORNO_RESULTADO"
      - '[[ "${TERRAFORM_VERSION:-}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && [[ "${TERRAFORM_PLATAFORMA:-}" =~ ^[a-z0-9]+_[a-z0-9]+$ ]] && [ -n "${TERRAFORM_BIN_DIR:-}" ] || { export MOTIVO="TERRAFORM_VERSION, TERRAFORM_PLATAFORMA o TERRAFORM_BIN_DIR invalidos (${TERRAFORM_VERSION:-<vacia>}, ${TERRAFORM_PLATAFORMA:-<vacia>}, ${TERRAFORM_BIN_DIR:-<vacia>})"; echo "ERROR - $MOTIVO"; false; }'
      - export TF_DESCARGA="$TRABAJO_DIR/terraform-descarga"; export TF_ZIP="terraform_${TERRAFORM_VERSION}_${TERRAFORM_PLATAFORMA}.zip"; export TF_SUMS="terraform_${TERRAFORM_VERSION}_SHA256SUMS"; export TF_URL="https://releases.hashicorp.com/terraform/$TERRAFORM_VERSION"; mkdir -p "$TF_DESCARGA" && curl -fsSL --retry 3 -o "$TF_DESCARGA/$TF_ZIP" "$TF_URL/$TF_ZIP" && curl -fsSL --retry 3 -o "$TF_DESCARGA/$TF_SUMS" "$TF_URL/$TF_SUMS" && echo "Bajados $TF_URL/$TF_ZIP y $TF_URL/$TF_SUMS" || { export MOTIVO="no se pudo bajar Terraform de $TF_URL ($TF_ZIP o $TF_SUMS)"; echo "ERROR - $MOTIVO"; false; }
      - export TF_SHA_ESPERADO="$(awk -v f="$TF_ZIP" '$2 == f {print $1}' "$TF_DESCARGA/$TF_SUMS")"; export TF_SHA_OBTENIDO="$(sha256sum "$TF_DESCARGA/$TF_ZIP" | cut -d ' ' -f 1)"; echo "SHA256 de $TF_ZIP - SHA256SUMS ${TF_SHA_ESPERADO:-<sin entrada>}, zip $TF_SHA_OBTENIDO"; [[ "$TF_SHA_ESPERADO" =~ ^[0-9a-f]{64}$ ]] && [ "$TF_SHA_OBTENIDO" = "$TF_SHA_ESPERADO" ] || { export MOTIVO="el SHA256 de $TF_ZIP ($TF_SHA_OBTENIDO) no coincide con el de $TF_SUMS (${TF_SHA_ESPERADO:-sin entrada para el zip})"; echo "ERROR - $MOTIVO"; false; }
      - mkdir -p "$TERRAFORM_BIN_DIR" && unzip -o -q "$TF_DESCARGA/$TF_ZIP" terraform -d "$TERRAFORM_BIN_DIR" && export TERRAFORM_VERSION_INSTALADA="$(terraform version -json | jq -r .terraform_version)" && [ "$TERRAFORM_VERSION_INSTALADA" = "$TERRAFORM_VERSION" ] && [ "$(command -v terraform)" = "$TERRAFORM_BIN_DIR/terraform" ] && echo "Terraform $TERRAFORM_VERSION_INSTALADA en $(command -v terraform)" || { export MOTIVO="no se pudo instalar Terraform $TERRAFORM_VERSION en $TERRAFORM_BIN_DIR (en el PATH esta $(command -v terraform || echo nada), version ${TERRAFORM_VERSION_INSTALADA:-sin leer})"; echo "ERROR - $MOTIVO"; false; }
      - export INSTALL_OK=1
    finally:
      - if [ "${INSTALL_OK:-}" != "1" ]; then export RESULTADO="${MOTIVO:-fallo inesperado en install}"; jq -nc --arg modelo "${MODELO:-}" --arg servicio "${SERVICIO:-}" --arg build_id "${CODEBUILD_BUILD_ID:-}" --arg build_started_at "${BUILD_STARTED_AT:-}" --arg rama "${RAMA:-}" --arg slug "${SLUG:-}" --arg corrida "${CORRIDA:-}" --arg n "${N:-}" --arg digest "${TAG_DIGEST:-}" --arg tag_repo "${TAG_REPO:-}" --arg commit "${CODEBUILD_RESOLVED_SOURCE_VERSION:-}" --arg webhook_event "${CODEBUILD_WEBHOOK_EVENT:-}" --arg webhook_trigger "${CODEBUILD_WEBHOOK_TRIGGER:-}" --arg webhook_actor "${CODEBUILD_WEBHOOK_ACTOR_ACCOUNT_ID:-}" --arg marca "$([ "${MARCA_ESCRITA:-}" = "1" ] && echo "${MARCA_URI:-}")" --arg serializacion_etag "${SERIALIZACION_ETAG:-}" --argjson serializacion "$([ -s "${SERIALIZACION_RESULTADO:-/nonexistent}" ] && cat "$SERIALIZACION_RESULTADO" || echo null)" --arg aprov_creado "${APROV_CREADO:-}" --arg aprov_marcador_previo "${MARCADOR_PREVIO:-}" --arg aprov_resultado "${APROVISIONAMIENTO:-sin_correr}" --arg aprov_marcador "${MARCADOR_URI:-}" --argjson aprov_crear_entorno "$([ -s "${CREAR_ENTORNO_RESULTADO:-/nonexistent}" ] && jq -c . "$CREAR_ENTORNO_RESULTADO" 2> /dev/null || echo null)" --arg crear_entorno_etag "${CREAR_ENTORNO_ETAG:-}" --arg desplegar_frontend_etag "${DESPLEGAR_FRONTEND_ETAG:-}" --arg esperar_entorno_etag "${ESPERAR_ENTORNO_ETAG:-}" --arg imagen_backend_prod "${BACKEND_IMAGEN_PROD:-}" --arg imagen_frontend_prod "${FRONTEND_IMAGEN_PROD:-}" --arg commit_cd_main_propio "${COMMIT_CD_MAIN_PROPIO:-}" --arg commit_cd_main_otro "${COMMIT_CD_MAIN_OTRO:-}" --arg commit_terraform "${COMMIT_TERRAFORM:-}" --arg terraform_version "${TERRAFORM_VERSION_INSTALADA:-}" --arg simular "${SIMULAR_TRABAJO_SEG:-0}" --arg resultado "$RESULTADO" 'def n:if . == "" then null else . end; def b:if . == "" then null else . == "true" end; {modelo:($modelo|n),servicio:($servicio|n),build_id:($build_id|n),build_started_at:($build_started_at|n),rama:($rama|n),slug:($slug|n),corrida:($corrida|n),n:($n|tonumber? // null),digest:($digest|n),imagen:(if $tag_repo != "" and $digest != "" then "\($tag_repo)@\($digest)" else null end),commit:($commit|n),webhook_event:($webhook_event|n),webhook_trigger:($webhook_trigger|n),webhook_actor_account_id:($webhook_actor|n),marca_turno:($marca|n),serializacion_script_etag:($serializacion_etag|n),serializacion:$serializacion,aprovisionamiento:{creado:($aprov_creado|b),marcador_previo:($aprov_marcador_previo|b),resultado:$aprov_resultado,marcador:($aprov_marcador|n),crear_entorno:$aprov_crear_entorno,crear_entorno_script_etag:($crear_entorno_etag|n),desplegar_frontend_script_etag:($desplegar_frontend_etag|n),esperar_entorno_script_etag:($esperar_entorno_etag|n)},imagenes_produccion:{backend:($imagen_backend_prod|n),frontend:($imagen_frontend_prod|n)},commits:{cd_main_propio:($commit_cd_main_propio|n),cd_main_otro:($commit_cd_main_otro|n),terraform:($commit_terraform|n)},terraform_version:($terraform_version|n),simular_trabajo_seg:($simular|tonumber? // null),resultado:$resultado}'; fi
  pre_build:
    on-failure: ABORT
    commands:
      - MISSING=""; for v in MODELO SERVICIO GITHUB_CD_REPO TAG_FILE SCRIPTS_BUCKET SCRIPTS_PREFIX TRABAJO_DIR MARCAS_BUCKET STATES_BUCKET PROYECTOS INTERVALO_SEG ESPERA_MAX_SEG SIMULAR_TRABAJO_SEG TERRAFORM_SUBDIR CODEBUILD_BUILD_ID; do [ -n "${!v:-}" ] || MISSING="$MISSING $v"; done; [ -z "$MISSING" ] || { export MOTIVO="faltan variables$MISSING"; echo "ERROR - $MOTIVO"; false; }
      - '[ "$MODELO" = "efimero" ] || { export MOTIVO="MODELO tiene que ser efimero ($MODELO)"; echo "ERROR - $MOTIVO"; false; }'
      - '[[ "$SIMULAR_TRABAJO_SEG" =~ ^[0-9]+$ ]] || { export MOTIVO="SIMULAR_TRABAJO_SEG tiene que ser un entero >= 0 ($SIMULAR_TRABAJO_SEG)"; echo "ERROR - $MOTIVO"; false; }'
      - '[[ "$MARCAS_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || { export MOTIVO="MARCAS_BUCKET invalido ($MARCAS_BUCKET)"; echo "ERROR - $MOTIVO"; false; }'
      - '[[ "$STATES_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || { export MOTIVO="STATES_BUCKET invalido ($STATES_BUCKET)"; echo "ERROR - $MOTIVO"; false; }'
      - '[[ "$SERVICIO" =~ ^(backend|frontend)$ ]] || { export MOTIVO="SERVICIO tiene que ser backend o frontend ($SERVICIO)"; echo "ERROR - $MOTIVO"; false; }'
      - if [ -n "${CODEBUILD_WEBHOOK_HEAD_REF:-}" ]; then export RAMA_ORIGEN="CODEBUILD_WEBHOOK_HEAD_REF"; export RAMA="${CODEBUILD_WEBHOOK_HEAD_REF#refs/heads/}"; else export RAMA_ORIGEN="CODEBUILD_SOURCE_VERSION (build manual)"; export RAMA="${CODEBUILD_SOURCE_VERSION:-}"; export RAMA="${RAMA#refs/heads/}"; fi; echo "Rama ${RAMA:-<vacia>} (de $RAMA_ORIGEN)"
      - '[[ "$RAMA" =~ ^(release|hotfix)/c([0-9]+)-([0-9]+)$ ]] && export CORRIDA="c${BASH_REMATCH[2]}" && export N="$((10#${BASH_REMATCH[3]}))" || { export MOTIVO="la rama ${RAMA:-<vacia>} no es de version, tiene que cumplir ^(release|hotfix)/c[0-9]+-[0-9]+$"; echo "ERROR - $MOTIVO"; false; }'
      - '[ "$N" -ge 1 ] && [ "$N" -le 99 ] || { export MOTIVO="N=$N (la version de la rama $RAMA) tiene que estar entre 1 y 99 (prioridad del listener N*10)"; echo "ERROR - $MOTIVO"; false; }'
      - export SLUG="$(printf '%s' "$RAMA" | tr '[:upper:]' '[:lower:]' | tr / -)"; echo "Slug $SLUG (${#SLUG} caracteres), corrida $CORRIDA, N $N"
      - '[ "${#SLUG}" -le 20 ] || { export MOTIVO="el slug $SLUG tiene ${#SLUG} caracteres, el maximo es 20"; echo "ERROR - $MOTIVO"; false; }'
      - '[ -f "$TAG_FILE" ] || { export MOTIVO="no existe $TAG_FILE en la raiz de la fuente"; echo "ERROR - $MOTIVO"; false; }'
      - jq -e 'all(.repo, .commit, .tag, .digest, .rama; type == "string" and length > 0)' "$TAG_FILE" > /dev/null || { export MOTIVO="$TAG_FILE no tiene repo, commit, tag, digest y rama"; echo "ERROR - $MOTIVO"; cat "$TAG_FILE"; false; }
      - export TAG_REPO="$(jq -r .repo "$TAG_FILE")"; export TAG_COMMIT="$(jq -r .commit "$TAG_FILE")"; export TAG_TAG="$(jq -r .tag "$TAG_FILE")"; export TAG_DIGEST="$(jq -r .digest "$TAG_FILE")"; export TAG_RAMA="$(jq -r .rama "$TAG_FILE")"
      - '[[ "$TAG_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { export MOTIVO="digest con formato invalido ($TAG_DIGEST)"; echo "ERROR - $MOTIVO"; false; }'
      - '[ "$TAG_RAMA" = "$RAMA" ] || { export MOTIVO="la rama de $TAG_FILE ($TAG_RAMA) no es la del build ($RAMA)"; echo "ERROR - $MOTIVO"; false; }'
      - if [ "$SERVICIO" = "backend" ]; then export OTRO_SERVICIO="frontend"; else export OTRO_SERVICIO="backend"; fi; export OTRO_FUENTE="${OTRO_SERVICIO}_cd_main"; export OTRO_FUENTE_VAR="CODEBUILD_SRC_DIR_$OTRO_FUENTE"; export OTRO_DIR="${!OTRO_FUENTE_VAR:-}"; export TERRAFORM_DIR="${CODEBUILD_SRC_DIR_terraform:-}/$TERRAFORM_SUBDIR"; echo "Fuente $OTRO_FUENTE en ${OTRO_DIR:-<vacia>}, fuente terraform en ${CODEBUILD_SRC_DIR_terraform:-<vacia>}"
      - '[ -n "$OTRO_DIR" ] && [ -f "$OTRO_DIR/$TAG_FILE" ] || { export MOTIVO="falta la fuente secundaria $OTRO_FUENTE o su $TAG_FILE ($OTRO_FUENTE_VAR=${OTRO_DIR:-<vacia>})"; echo "ERROR - $MOTIVO"; false; }'
      - '[ -n "${CODEBUILD_SRC_DIR_terraform:-}" ] && [ -d "$TERRAFORM_DIR" ] || { export MOTIVO="falta la fuente secundaria terraform o su directorio $TERRAFORM_SUBDIR (CODEBUILD_SRC_DIR_terraform=${CODEBUILD_SRC_DIR_terraform:-<vacia>})"; echo "ERROR - $MOTIVO"; false; }'
      - export COMMIT_CD_MAIN_PROPIO="$(git rev-parse --verify -q "origin/main^{commit}" 2> /dev/null)"; export COMMIT_CD_MAIN_OTRO="$(git -C "$OTRO_DIR" rev-parse --verify -q "HEAD^{commit}" 2> /dev/null)"; export COMMIT_TERRAFORM="$(git -C "$CODEBUILD_SRC_DIR_terraform" rev-parse --verify -q "HEAD^{commit}" 2> /dev/null)"; echo "Commits - origin/main propio ${COMMIT_CD_MAIN_PROPIO:-<sin resolver>}, $OTRO_FUENTE ${COMMIT_CD_MAIN_OTRO:-<sin resolver>}, terraform ${COMMIT_TERRAFORM:-<sin resolver>}"
      - '[[ "$COMMIT_CD_MAIN_PROPIO" =~ ^[0-9a-f]{40}$ ]] || { export MOTIVO="no se pudo resolver origin/main en la fuente principal (hace falta el clon completo)"; echo "ERROR - $MOTIVO"; false; }'
      - '[[ "$COMMIT_CD_MAIN_OTRO" =~ ^[0-9a-f]{40}$ ]] || { export MOTIVO="no se pudo resolver el commit de la fuente $OTRO_FUENTE"; echo "ERROR - $MOTIVO"; false; }'
      - '[[ "$COMMIT_TERRAFORM" =~ ^[0-9a-f]{40}$ ]] || { export MOTIVO="no se pudo resolver el commit de la fuente terraform"; echo "ERROR - $MOTIVO"; false; }'
      - git show "origin/main:$TAG_FILE" > "$TRABAJO_DIR/tag-main-$SERVICIO.json" 2> /dev/null && cp "$OTRO_DIR/$TAG_FILE" "$TRABAJO_DIR/tag-main-$OTRO_SERVICIO.json" || { export MOTIVO="no se pudo leer $TAG_FILE de origin/main (fuente principal) o de $OTRO_FUENTE"; echo "ERROR - $MOTIVO"; false; }
      - export TAG_MAIN_ERROR=""; for s in backend frontend; do f="$TRABAJO_DIR/tag-main-$s.json"; if ! jq -e 'all(.repo, .commit, .tag, .digest; type == "string" and length > 0)' "$f" > /dev/null 2>&1; then TAG_MAIN_ERROR="$TAG_MAIN_ERROR; el $TAG_FILE de main de $s no tiene repo, commit, tag y digest"; elif ! [[ "$(jq -r .digest "$f")" =~ ^sha256:[0-9a-f]{64}$ ]]; then TAG_MAIN_ERROR="$TAG_MAIN_ERROR; digest con formato invalido en el $TAG_FILE de main de $s ($(jq -r .digest "$f"))"; fi; done; [ -z "$TAG_MAIN_ERROR" ] || { export MOTIVO="${TAG_MAIN_ERROR#; }"; echo "ERROR - $MOTIVO"; cat "$TRABAJO_DIR"/tag-main-*.json; false; }
      - export BACKEND_IMAGEN_PROD="$(jq -r '"\(.repo)@\(.digest)"' "$TRABAJO_DIR/tag-main-backend.json")"; export FRONTEND_IMAGEN_PROD="$(jq -r '"\(.repo)@\(.digest)"' "$TRABAJO_DIR/tag-main-frontend.json")"; echo "Imagenes de produccion - backend $BACKEND_IMAGEN_PROD (commit $(jq -r .commit "$TRABAJO_DIR/tag-main-backend.json")), frontend $FRONTEND_IMAGEN_PROD (commit $(jq -r .commit "$TRABAJO_DIR/tag-main-frontend.json"))"
      - export MARCA_URI="s3://$MARCAS_BUCKET/entornos/$SLUG/turnos/$CODEBUILD_BUILD_ID.json"; export START_TIME="$(aws codebuild batch-get-builds --ids "$CODEBUILD_BUILD_ID" --query 'builds[0].startTime' --output text 2> /dev/null)"; [ -n "$START_TIME" ] && [ "$START_TIME" != "None" ] && jq -nc --arg build_id "$CODEBUILD_BUILD_ID" --arg rama "$RAMA" --arg slug "$SLUG" --arg start_time "$START_TIME" '{build_id:$build_id,rama:$rama,slug:$slug,start_time:$start_time}' | aws s3 cp - "$MARCA_URI" --content-type application/json --only-show-errors && export MARCA_ESCRITA=1 && echo "Marca de turno $MARCA_URI (start_time $START_TIME)" || { export MOTIVO="no se pudo escribir la marca de turno $MARCA_URI (start_time ${START_TIME:-<sin leer>})"; echo "ERROR - $MOTIVO"; false; }
      - export VALIDACION_OK=1; echo "Validacion ok - servicio $SERVICIO, rama $RAMA, slug $SLUG, corrida $CORRIDA, N $N, imagen $TAG_REPO@$TAG_DIGEST (commit $TAG_COMMIT, tag $TAG_TAG), terraform $TERRAFORM_VERSION_INSTALADA"
    finally:
      - if [ "${VALIDACION_OK:-}" != "1" ]; then export RESULTADO="${MOTIVO:-fallo inesperado en pre_build}"; jq -nc --arg modelo "${MODELO:-}" --arg servicio "${SERVICIO:-}" --arg build_id "${CODEBUILD_BUILD_ID:-}" --arg build_started_at "${BUILD_STARTED_AT:-}" --arg rama "${RAMA:-}" --arg slug "${SLUG:-}" --arg corrida "${CORRIDA:-}" --arg n "${N:-}" --arg digest "${TAG_DIGEST:-}" --arg tag_repo "${TAG_REPO:-}" --arg commit "${CODEBUILD_RESOLVED_SOURCE_VERSION:-}" --arg webhook_event "${CODEBUILD_WEBHOOK_EVENT:-}" --arg webhook_trigger "${CODEBUILD_WEBHOOK_TRIGGER:-}" --arg webhook_actor "${CODEBUILD_WEBHOOK_ACTOR_ACCOUNT_ID:-}" --arg marca "$([ "${MARCA_ESCRITA:-}" = "1" ] && echo "${MARCA_URI:-}")" --arg serializacion_etag "${SERIALIZACION_ETAG:-}" --argjson serializacion "$([ -s "${SERIALIZACION_RESULTADO:-/nonexistent}" ] && cat "$SERIALIZACION_RESULTADO" || echo null)" --arg aprov_creado "${APROV_CREADO:-}" --arg aprov_marcador_previo "${MARCADOR_PREVIO:-}" --arg aprov_resultado "${APROVISIONAMIENTO:-sin_correr}" --arg aprov_marcador "${MARCADOR_URI:-}" --argjson aprov_crear_entorno "$([ -s "${CREAR_ENTORNO_RESULTADO:-/nonexistent}" ] && jq -c . "$CREAR_ENTORNO_RESULTADO" 2> /dev/null || echo null)" --arg crear_entorno_etag "${CREAR_ENTORNO_ETAG:-}" --arg desplegar_frontend_etag "${DESPLEGAR_FRONTEND_ETAG:-}" --arg esperar_entorno_etag "${ESPERAR_ENTORNO_ETAG:-}" --arg imagen_backend_prod "${BACKEND_IMAGEN_PROD:-}" --arg imagen_frontend_prod "${FRONTEND_IMAGEN_PROD:-}" --arg commit_cd_main_propio "${COMMIT_CD_MAIN_PROPIO:-}" --arg commit_cd_main_otro "${COMMIT_CD_MAIN_OTRO:-}" --arg commit_terraform "${COMMIT_TERRAFORM:-}" --arg terraform_version "${TERRAFORM_VERSION_INSTALADA:-}" --arg simular "${SIMULAR_TRABAJO_SEG:-0}" --arg resultado "$RESULTADO" 'def n:if . == "" then null else . end; def b:if . == "" then null else . == "true" end; {modelo:($modelo|n),servicio:($servicio|n),build_id:($build_id|n),build_started_at:($build_started_at|n),rama:($rama|n),slu