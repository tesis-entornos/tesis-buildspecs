      - if [ "$MARCADOR_PREVIO" = "false" ]; then export CREAR_ENTORNO_ETAG="$(aws s3api get-object --bucket "$SCRIPTS_BUCKET" --key "$SCRIPTS_PREFIX/scripts/crear-entorno.sh" "$TRABAJO_DIR/crear-entorno.sh" --query ETag --output text | tr -d '"')"; export DESPLEGAR_FRONTEND_ETAG="$(aws s3api get-object --bucket "$SCRIPTS_BUCKET" --key "$SCRIPTS_PREFIX/scripts/desplegar-frontend.sh" "$TRABAJO_DIR/desplegar-frontend.sh" --query ETag --output text | tr -d '"')"; export ESPERAR_ENTORNO_ETAG="$(aws s3api get-object --bucket "$SCRIPTS_BUCKET" --key "$SCRIPTS_PREFIX/scripts/esperar-entorno.sh" "$TRABAJO_DIR/esperar-entorno.sh" --query ETag --output text | tr -d '"')"; [ -n "$CREAR_ENTORNO_ETAG" ] && [ -n "$DESPLEGAR_FRONTEND_ETAG" ] && [ -n "$ESPERAR_ENTORNO_ETAG" ] && echo "Scripts de s3://$SCRIPTS_BUCKET/$SCRIPTS_PREFIX/scripts/ - crear-entorno.sh $CREAR_ENTORNO_ETAG, desplegar-frontend.sh $DESPLEGAR_FRONTEND_ETAG, esperar-entorno.sh $ESPERAR_ENTORNO_ETAG" || { export APROVISIONAMIENTO="fallo"; export MOTIVO="aprovisionamiento - no se pudieron bajar crear-entorno.sh, desplegar-frontend.sh o esperar-entorno.sh de s3://$SCRIPTS_BUCKET/$SCRIPTS_PREFIX/scripts/"; echo "ERROR - $MOTIVO"; false; }; fi
      - 'if [ "$MARCADOR_PREVIO" = "false" ]; then MODELO="$MODELO" SLUG="$SLUG" N="$N" CORRIDA="$CORRIDA" RAMA="$RAMA" TERRAFORM_DIR="$TERRAFORM_DIR" BACKEND_IMAGEN_PROD="$BACKEND_IMAGEN_PROD" FRONTEND_IMAGEN_PROD="$FRONTEND_IMAGEN_PROD" STATES_BUCKET="$STATES_BUCKET" SCRIPTS_DIR="$TRABAJO_DIR" SALIDA_JSON="$CREAR_ENTORNO_RESULTADO" bash "$TRABAJO_DIR/crear-entorno.sh" && export APROVISIONAMIENTO="ok" && export APROV_CREADO=true || { export APROVISIONAMIENTO="fallo"; export APROV_CREADO=false; export MOTIVO="aprovisionamiento - $(jq -r "\"\(.etapa // \"sin etapa\"): \(.motivo // \"sin motivo\")\"" "$CREAR_ENTORNO_RESULTADO" 2> /dev/null || echo "sin resultado de crear-entorno.sh")"; echo "ERROR - $MOTIVO"; false; }; fi'
